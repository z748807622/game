<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="description" content="2–4 人合作纵版打飞机：一台主机算世界，队友各自操控飞机，共享分数打波次和 Boss。">
<title>打飞机 · 2–4 人合作</title>
<style>
  :root {
    --bg: #070b12;
    --panel: #121823;
    --panel-2: #18202e;
    --line: #26303f;
    --text: #e9eef6;
    --muted: #91a0b5;
    --accent: #4c8dff;
    --ok: #34d17b;
    --warn: #f5a623;
    --bad: #ff5d5d;
    --gold: #ffd166;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    color: var(--text);
    background:
      radial-gradient(1100px 560px at 50% -10%, #15223a, transparent 62%),
      radial-gradient(800px 500px at 90% 110%, #1a1430, transparent 60%),
      var(--bg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .hidden { display: none !important; }

  /* ---------------------------------------------------------------- 顶栏 */
  .top {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(7, 11, 18, .86);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .4px; white-space: nowrap; }
  .brand small { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 6px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #556; display: inline-block; flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(52, 209, 123, .7); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .link {
    color: var(--muted); text-decoration: none; font-size: 12px;
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; white-space: nowrap;
  }
  .link:active { background: var(--panel-2); }

  /* ---------------------------------------------------------------- 布局 */
  main {
    width: 100%; max-width: 1040px; margin: 0 auto;
    padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
  }
  #lobbyCard { max-width: 460px; margin: 6vh auto 0; }
  #roomWrap {
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
  }
  @media (max-width: 820px) {
    #roomWrap { display: flex; flex-direction: column-reverse; }
    #lobbyCard { margin-top: 8px; }
  }

  .card {
    background: linear-gradient(180deg, rgba(24, 32, 46, .94), rgba(18, 24, 35, .96));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 16px 34px rgba(0, 0, 0, .32);
  }
  .card h2 {
    margin: 0 0 2px; font-size: 13px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: baseline; gap: 8px;
  }
  .card h2 span { font-size: 11px; letter-spacing: 0; color: #6f7f95; text-transform: none; font-weight: 400; }

  .field { display: flex; align-items: center; gap: 10px; }
  .field > span { flex: 0 0 46px; color: var(--muted); font-size: 13px; }
  input {
    flex: 1; min-width: 0; min-height: 46px;
    background: #0a0f18; border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 0 12px;
    font: inherit; font-size: 16px; /* 16px 避免 iOS 聚焦缩放 */
    outline: none; -webkit-appearance: none; appearance: none;
  }
  input::placeholder { color: #5a6a80; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(76, 141, 255, .18); }

  button {
    min-height: 46px; padding: 0 16px; border-radius: 10px; border: 0;
    font: inherit; font-size: 15px; font-weight: 600; color: #fff;
    background: var(--accent); cursor: pointer;
    transition: filter .15s ease, transform .06s ease;
  }
  button:active { transform: scale(.985); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-weight: 500; }
  button.tiny { min-height: 44px; padding: 0 12px; font-size: 12px; font-weight: 500; }
  button.block { width: 100%; }
  button:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .row { display: flex; gap: 8px; }
  .row > button { flex: 1; }
  .row > input { flex: 1; }
  .sep {
    display: flex; align-items: center; gap: 10px;
    color: #65758c; font-size: 12px; margin: 2px 0;
  }
  .sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
  .hint.bad { color: #ffb3b3; }
  .hint.ok { color: #9df0bf; }
  .hint strong { color: var(--text); }

  /* ---------------------------------------------------------------- 房间卡 */
  .room-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .muted { color: var(--muted); font-size: 12px; }
  .bigcode {
    font: 700 26px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 3px; color: var(--gold); margin-top: 3px;
  }
  .room-actions { display: flex; gap: 6px; }
  .members-head {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px;
  }
  .members { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .member {
    display: flex; align-items: center; gap: 8px;
    background: #0d131d; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 13px; min-height: 40px;
  }
  .member .mdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .member .mdot.off { background: #5a6474; }
  .member .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member .pill {
    font-size: 10px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 7px; white-space: nowrap;
  }
  .member.self { border-color: rgba(76, 141, 255, .5); }

  /* ---------------------------------------------------------------- 舞台 */
  .stage {
    position: relative;
    width: min(100%, calc((100dvh - 96px) * 2 / 3));
    max-width: 560px;
    margin: 0 auto;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #05070d;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    touch-action: none;
  }
  #game { display: block; width: 100%; height: auto; aspect-ratio: 2 / 3; cursor: crosshair; touch-action: none; }

  .hud {
    position: absolute; inset: 0; pointer-events: none;
    padding: 10px 12px;
    font-variant-numeric: tabular-nums;
  }
  .hud-left { position: absolute; top: 10px; left: 12px; }
  .score { font-size: 22px; font-weight: 700; line-height: 1.1; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .wave { font-size: 12px; color: var(--muted); }
  .hud-right { position: absolute; top: 10px; right: 12px; text-align: right; }
  .lives { font-size: 13px; color: #ff9a9a; letter-spacing: 1px; }
  .lag { font-size: 11px; color: var(--muted); }
  .lag.warn { color: var(--warn); }
  .lag.bad { color: #ff9a9a; }
  .boss { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); width: 72%; }
  .boss-name { font-size: 10px; letter-spacing: 2px; color: #ffb3b3; text-align: center; margin-bottom: 3px; }
  .boss-track { height: 6px; background: rgba(255, 255, 255, .12); border-radius: 999px; overflow: hidden; }
  #bossBar { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff5d5d, #ffd166); transition: width .12s linear; }

  .chips {
    position: absolute; left: 10px; right: 10px; bottom: 10px;
    display: flex; gap: 6px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(4, 8, 14, .62); border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px; padding: 3px 8px; font-size: 11px; color: #dbe5f2;
  }
  .chip i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .chip.off { opacity: .45; }
  .chip.me { border-color: rgba(76, 141, 255, .8); }

  .overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    padding: 22px; text-align: center;
    background: radial-gradient(circle at 50% 38%, rgba(6, 10, 17, .42), rgba(3, 6, 11, .86));
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  .overlay-inner { width: min(100%, 300px); display: flex; flex-direction: column; gap: 10px; }
  .overlay-title { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  .overlay-text { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; white-space: pre-line; }
  .overlay button { margin-top: 2px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: rgba(9, 14, 22, .94); border: 1px solid var(--line);
    color: var(--text); font-size: 13px; padding: 10px 14px; border-radius: 999px;
    max-width: min(90vw, 420px); text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
    z-index: 40; box-shadow: 0 10px 28px rgba(0,0,0,.45);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.ok { border-color: rgba(52, 209, 123, .5); }
  .toast.warn { border-color: rgba(245, 166, 35, .5); }
  .toast.bad { border-color: rgba(255, 93, 93, .55); }
</style>
</head>
<body>
<header class="top">
  <div class="brand">打飞机 <small>2–4 人合作</small></div>
  <div class="status"><i id="dot" class="dot"></i><span id="statusText">未连接</span></div>
  <a class="link" href="./">中继 Demo</a>
</header>

<main>
  <section id="lobbyCard" class="card">
    <h2>进入房间 <span>同一局域网即可联机</span></h2>
    <div class="field"><span>昵称</span><input id="nickname" maxlength="12" placeholder="匿名玩家" autocomplete="nickname"></div>
    <div class="field"><span>Token</span><input id="token" maxlength="64" value="dev-token" autocomplete="off"></div>
    <div class="field"><span>密码</span><input id="pwd" maxlength="32" placeholder="可选" autocomplete="off"></div>
    <div class="row"><button id="btnCreate" class="block">创建房间</button></div>
    <div class="sep">或加入已有房间</div>
    <div class="row">
      <input id="code" class="code" maxlength="4" placeholder="4 位房间码" autocapitalize="characters" autocomplete="off">
      <button id="btnJoin" class="ghost">加入</button>
    </div>
    <p id="joinHint" class="hint">一人创建房间拿到 4 位码，其他人输入房间码加入。</p>
    <p class="hint" id="connHint">手机与电脑连同一 Wi-Fi，打开 <strong>http://电脑IP:8080/plane.html</strong>。</p>
  </section>

  <section id="roomWrap" class="hidden">
    <div class="card room">
      <div class="room-head">
        <div>
          <div class="muted">房间码</div>
          <div id="roomCode" class="bigcode">----</div>
        </div>
        <div class="room-actions">
          <button id="btnCopy" class="ghost tiny">复制</button>
          <button id="btnLeave" class="ghost tiny">离开</button>
        </div>
      </div>
      <div class="members-head"><span>玩家</span><span id="memberCount">0/4</span></div>
      <ul id="members" class="members"></ul>
      <button id="btnStart" class="block">开始游戏</button>
      <p id="roomHint" class="hint"></p>
      <p class="hint">电脑：鼠标移动；手机：点按/拖动。飞机以固定速度追目标点，不会瞬移。</p>
    </div>

    <div id="stage" class="stage">
      <canvas id="game" width="480" height="720" aria-label="游戏画面"></canvas>
      <div class="hud">
        <div class="hud-left">
          <div id="hudScore" class="score">0</div>
          <div id="hudWave" class="wave">第 1 波</div>
        </div>
        <div class="hud-right">
          <div id="hudLives" class="lives">♥♥♥</div>
          <div id="hudLag" class="lag">--</div>
        </div>
        <div id="bossWrap" class="boss hidden">
          <div class="boss-name">BOSS</div>
          <div class="boss-track"><i id="bossBar"></i></div>
        </div>
        <ul id="hudPlayers" class="chips"></ul>
      </div>
      <div id="overlay" class="overlay">
        <div class="overlay-inner">
          <div id="overlayTitle" class="overlay-title">等待开始</div>
          <p id="overlayText" class="overlay-text"></p>
          <button id="overlayBtn" class="hidden"></button>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="relay.js"></script>
<script src="plane-core.js"></script>
<script src="plane-net.js"></script>
<script src="plane.js"></script>
</body>
</html>
