# 前后端分离部署样例：nginx 托管静态页面，并把同域 /ws 反代到 Go 后端。
#
# 使用方式：
#   1. make web-dist，然后把 dist/web 拷到 /var/www/game（root 指向它）
#   2. 后端只监听本机：
#        ./bin/relay -addr 127.0.0.1:8080 -serve-web=false \
#            -trusted-proxies 127.0.0.1/32
#   3. 把本文件放进 /etc/nginx/conf.d/game.conf（或 include 进 http 块），
#      按需修改 server_name / root / upstream，然后 nginx -t && nginx -s reload
#
# 前后端不同域时：本文件只保留静态站，前端 web/config.js 里填
#   window.RELAY_CONFIG = { wsUrl: 'wss://api.example.com/ws' };
# 后端所在域名仍需类似的 /ws 反代（Upgrade 与超时配置一致）。
#
# HTTPS：在 server 上加 listen 443 ssl 与证书即可；浏览器会按同源规则
# 自动用 wss://<当前域名>/ws，前端不需要改配置。

upstream relay_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name game.example.com;

    # dist/web 的部署位置
    root /var/www/game;
    index index.html;

    # 静态页面
    location / {
        try_files $uri $uri/ =404;
    }

    # 运维改了 wsUrl 希望立刻生效，别让浏览器缓存旧配置
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # WebSocket 入口：必须透传 Upgrade/Connection，空闲超时 > 心跳间隔（默认 20s）
    location = /ws {
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # 健康检查：不对外暴露后端端口也能探活
    location = /healthz {
        proxy_pass http://relay_backend;
        access_log off;
    }
}
